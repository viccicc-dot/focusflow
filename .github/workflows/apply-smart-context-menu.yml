name: Apply Smart Context Menu

on:
  push:
    branches: [feature/shimo-smart-table-parity]
    paths:
      - scripts/apply-smart-context-menu.mjs
      - client/src/SmartContextMenu.jsx
      - client/src/smart-context-menu.css
      - server/smart-record-extras.js
      - .github/workflows/apply-smart-context-menu.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/shimo-smart-table-parity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply context menu integration
        run: node scripts/apply-smart-context-menu.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify server syntax
        run: |
          node --check server/smart-tables.js
          node --check server/smart-record-extras.js

      - name: Build client
        run: npm run build

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/SmartTable.jsx server/smart-tables.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat: integrate smart table right-click actions"
            git push origin HEAD:feature/shimo-smart-table-parity
          fi
