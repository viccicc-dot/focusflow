name: Apply Smart Tables Phase 1

on:
  push:
    branches: [feature/smart-tables-phase-1]
    paths:
      - scripts/apply-smart-tables-phase1.mjs
      - .github/workflows/apply-smart-tables-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/smart-tables-phase-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration patch
        run: node scripts/apply-smart-tables-phase1.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate server and database initialization
        env:
          DATABASE_PATH: ./data/phase1-ci.db
          SEED_DEMO: 'false'
        run: |
          node --check server/db.js
          node --check server/index.js
          node --check server/smart-tables.js
          node -e "import('./server/db.js').then(({initDb,db})=>{initDb(); const names=db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'smart_%' ORDER BY name\").all(); if(names.length!==5) throw new Error('Expected 5 smart table schema objects'); console.log(names); db.close();})"

      - name: Build frontend
        run: npm run build

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.js server/index.js client/src/App.jsx .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "feat: integrate smart tables into FocusFlow"
          git push origin HEAD:feature/smart-tables-phase-1

# Triggered after the workflow file existed on the feature branch.
