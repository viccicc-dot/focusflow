name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/db.js
          node --check server/recurrence.js
          node --check server/seed-data.js
          node --check server/seed.js

      - name: Build client
        run: npm run build
